---
- name: Create database
  become: true
  become_user: postgres
  postgresql_db:
    name: "{{ radius.database.name }}"
    owner: "postgres"
    state: present
  register: db_created

- name: Create schema
  become: true
  become_user: postgres
  when: db_created.changed
  postgresql_query:
    db: "{{ radius.database.name }}"
    query: "{{ lookup('template', 'schema.sql') }}"

- name: Grant permissions on radcheck table to main user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ radius.database.name }}"
    privs: SELECT,INSERT,UPDATE
    type: table
    objs: radcheck
    roles: "{{ database.user }}"
    state: present

- name: Grant permissions to radcheck_id_seq sequence to main user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: "{{ radius.database.name }}"
    privs: USAGE,SELECT
    type: sequence
    objs: radcheck_id_seq
    roles: "{{ database.user }}"
    state: present

- name: Check if the radius user exists
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ radius.database.name }}"
    query: "SELECT 1 FROM pg_roles WHERE rolname = '{{ radius.database.user }}'"
  register: user_exists

- name: Setup radius user
  become: true
  become_user: postgres
  when: user_exists.rowcount == 0
  postgresql_query:
    db: "{{ radius.database.name }}"
    query: "{{ lookup('template', 'setup.sql') }}"

- name: Print ansible_default_ipv4
  debug:
    msg: "{{ hostvars['radius'].ansible_default_ipv4 }}"

- name: Allow remote access for radius
  become: true
  become_user: postgres
  community.postgresql.postgresql_pg_hba:
    dest: "{{ db_root }}/pg_hba.conf"
    contype: hostssl
    databases: "{{ radius.database.name }}"
    users: "{{ radius.database.user }},{{ database.user }}"
    address: 0.0.0.0/0
    method: scram-sha-256
  notify: Reload postgres

- name: Insert users
  become: true
  become_user: postgres
  loop: "{{ groups['client'] }}"
  loop_control:
    loop_var: user
  vars:
    client_name: "{{ hostvars[user].ike_id }}"
    client_secret: "{{ hostvars[user].ike_secret }}"
  community.postgresql.postgresql_query:
    db: "{{ radius.database.name }}"
    query: |
      INSERT INTO radcheck (UserName, Attribute, op, Value)
      SELECT '{{ client_name }}', 'Cleartext-Password', ':=', '{{ client_secret }}'
      WHERE NOT EXISTS (
        SELECT 1 FROM radcheck WHERE UserName = '{{ client_name }}' AND Attribute = 'Cleartext-Password'
      );
